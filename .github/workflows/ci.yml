# No_Loop CI — gates per CODING_STANDARDS.md §12 and LOOPS.md LOOP-1.
# Network-marked tests are skipped by default (CODING_STANDARDS §8.7).

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies (from lock)
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock.txt
        env:
          PIP_CACHE_DIR: ${{ github.workspace }}/.pipcache

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Lint (ruff check, zero warnings)
        run: ruff check .

      - name: Types (mypy)
        run: mypy app tests

      - name: Tests (network marks skipped by default)
        run: pytest --cov=app --cov-fail-under=0

      - name: Domain purity gate (no IO/vendor imports in app/domain)
        shell: pwsh
        run: |
          $hits = git grep -n -E "import (httpx|sqlalchemy|selectolax|rapidfuzz|playwright)|from (httpx|sqlalchemy|selectolax|rapidfuzz|playwright)" -- app/domain/
          if ($hits) { Write-Host $hits; exit 1 } else { Write-Host "domain purity OK" }

      - name: Vendor-name gate (no portal/vendor names in domain+application layers)
        shell: pwsh
        run: |
          $hits = git grep -n -i -E "linkedin|naukri|gemini|ollama|greenhouse|ashby|workday|indeed|remotive|arbeitnow|remoteok|jobicy|adzuna|jooble" -- app/domain/ app/application/
          if ($hits) { Write-Host $hits; exit 1 } else { Write-Host "vendor-name gate OK" }

      - name: .gitignore integrity (.references/ must stay ignored)
        shell: pwsh
        run: |
          $ignored = git check-ignore .references/PROVENANCE.md
          if (-not $ignored) { Write-Host ".references/ is NOT ignored - refusing (R-ENV-6)"; exit 1 }
          Write-Host ".references/ ignored OK"
